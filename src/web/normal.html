<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/normal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <title>Rock Paper Scissors - Normal</title>
</head>
<body>

    <a class="back" href="index.html">&lt; Main menu</a>

    <section>
        <header>
            <p>
                Rock <br>
                Paper <br>
                Scissors <br>
            </p>

            <div class="scoreTab">
                <p>SCORE</p>
                <p id="score">0</p>
            </div>
        </header>

        <div class="choices" id="pickScreen">
            <picture>
                <div class="paper" id="paper"><img class="paper-icon" src="../../public/icon-paper.svg" alt="paper"></div>
                <div class="rock" id="rock"><img src="../../public/icon-rock.svg" alt="rock"></div>
                <div class="scissors" id="scissors"><img src="../../public/icon-scissors.svg" alt="scissors"></div>
                <img id="triangle" src="../../public/bg-triangle.svg" alt="">
            </picture>
        </div>

        <div class="result hidden" id="resultScreen">
          <div class="result-card">
            <div class="pick-column" id="playerColumn">
                <p class="pick-label">YOU PICKED</p>
                <div class="picked-icon" id="playerIconWrap"></div>
            </div>

            <div class="result-text" id="resultText">
                <h2 id="resultMessage"></h2>
                <button id="playAgain">PLAY AGAIN</button>
            </div>

            <div class="pick-column" id="houseColumn">
                <p class="pick-label">THE HOUSE PICKED</p>
                <div class="wheel-wrap">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="houseWheel"></div>
                    <div class="wheel-hub"></div>
                </div>
            </div>
        </div>
        </div>

    </section>

    <button class="rules-button" id="rulesButton" aria-label="Show game rules">
  ?
</button>

<div class="rules-modal hidden" id="rulesModal">
  <div class="rules-box">
    <button class="close-rules" id="closeRules" aria-label="Close rules">
      ×
    </button>

    <h2>How to Play</h2>

    <p>Choose one option, then the computer will randomly choose its own.</p>

    <div class="rules-list" id="rulesList"></div>

    <p class="score-rule">
      Win: +1 point<br>
      Lose: -1 point<br>
      Tie: no score change
    </p>
  </div>
</div>

    <script src="../script/normal.js"></script>
</body>
</html>
