<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <title>Rock Paper Scissors</title>
</head>

<body>

  <section>

    <div class="banner">

      <div class="banner-item rock">
        <img src="../../public/icon-rock.svg" alt="Rock">
      </div>

      <div class="banner-item paper">
        <img src="../../public/icon-paper.svg" alt="Paper">
      </div>

      <div class="banner-title">
        <h1>ROCK</h1>
        <h1>PAPER</h1>
        <h1>SCISSORS</h1>
      </div>

      <div class="banner-item scissors">
        <img src="../../public/icon-scissors.svg" alt="Scissors">
      </div>

      <div class="banner-item lizard">
        <img src="../../public/icon-lizard.svg" alt="Lizard">
      </div>

    </div>


    <div class="mode-selection">

      <div id="normal" class="mode normalMode">

        <img src="../../public/image-rules.svg" alt="Normal">

        <p>Normal</p>

      </div>


      <div id="hard" class="mode hardMode">

        <img src="../../public/image-rules-bonus.svg" alt="Hard">

        <p>Hard</p>

      </div>

    </div>


    <div class="button">

      <a href="" id="link">

        <button id="start" disabled>

          <p>START GAME</p>

        </button>

      </a>

    </div>

  </section>


  <script src="../script/script.js"></script>

</body>
</html>
