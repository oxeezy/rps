<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../../public/images/favicon-32x32.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap">

  <title>Frontend Mentor | Rock, Paper, Scissors</title>
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

<body>
  <section>
    <header>
      <h1>Rock Paper Scissors</h1>
    </header>

    <div id="normal" class="normalMode">
        <picture>
          <img src="/public/image-rules.svg" alt="rules">
        </picture>
      <p>Normal</p>
    </div>

    <div id="hard" class="hardMode">
      
        <picture>
          <img src="/public/image-rules-bonus.svg" alt="rules">
        </picture>
  
      <p>Hard</p>
    </div>

    <div class="button">
      <a href="" id="link">
        <button id="start">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <p>Start Game</p>

        </button>
      </a>
    </div>
  </section>
  
  <script src="/src/script/script.js"></script>
